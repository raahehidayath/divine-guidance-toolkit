name: Build and deploy Raah e Hidayath

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static application
        run: bun run build
        env:
          NITRO_PRESET: node_server

      - name: Render application for static hosting
        run: |
          PORT=4173 node .output/server/index.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o .output/public/index.html; then
              break
            fi
            sleep 1
          done
          test -s .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          printf '%s\n' 'raahehidayath.online' > .output/public/CNAME
          touch .output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4